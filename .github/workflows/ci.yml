name: CI/CD Portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  test-and-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript types
        run: npx tsc --noEmit

      - name: Run lint
        run: npm run lint

      - name: Build Next.js application
        run: npm run build


  immersive-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: immersive
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: immersive/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run immersive tests
        run: npm test

  deploy:
    if: github.ref == 'refs/heads/main' && success()
    needs: [test-and-build, immersive-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render or notify
        run: |
          if [ -n "${RENDER_DEPLOY_HOOK_URL}" ]; then
            curl -X POST "${RENDER_DEPLOY_HOOK_URL}"
            echo "Đã kích hoạt deploy trên Render."
          else
            echo "Build sẵn sàng deploy trên Render qua render.yaml (autoDeploy: true). Thiết lập RENDER_DEPLOY_HOOK_URL secret để tự động deploy."
          fi
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
