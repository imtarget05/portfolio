name: CI / Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install immersive dependencies
        run: npm ci --prefix ./immersive

      - name: Security audit — npm audit
        run: npm audit --audit-level=high

      - name: Security audit — immersive
        run: npm audit --prefix ./immersive --audit-level=high

      - name: Security scan — detect hardcoded secrets
        run: |
          echo "Scanning for hardcoded credentials..."
          if git grep -IlE 'postgres(ql)?://[^/[:space:]]+:[^@[:space:]]+@' -- src immersive workers scripts; then
            echo "❌ Hardcoded database credentials detected!"
            exit 1
          fi
          echo "✅ No hardcoded credentials found"

      - name: Lint Next.js
        run: npm run lint

      - name: Typecheck Next.js
        run: npx tsc --noEmit

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Lint immersive
        run: npm run lint --prefix ./immersive

      - name: Typecheck immersive
        run: npm exec --prefix ./immersive -- tsc --noEmit -p immersive/tsconfig.json

      - name: Build immersive (Vite)
        run: npm run build --prefix ./immersive

      - name: Test immersive
        run: npm test --prefix ./immersive

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npx playwright test
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Run Lighthouse CI
        run: npx lighthouse http://localhost:3000 --output=json --output-path=./lighthouse-report.json --chrome-flags="--headless --no-sandbox --disable-gpu"
        continue-on-error: true

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: ./lighthouse-report.json

  # Production deployment is intentionally not automated until a real preview
  # environment and staging smoke tests are configured and verified.
