name: CI / Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install immersive dependencies
        run: npm ci --prefix ./immersive

      - name: Security audit — npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Security scan — detect hardcoded secrets
        run: |
          echo "Scanning for hardcoded credentials..."
          if rg -i 'postgresql://[^[:space:]]*@[^[:space:]]*' src/ immersive/ workers/ --no-heading 2>/dev/null | grep -v 'DATABASE_URL' | grep -v 'your_cloudflare' | grep -v 'dummy:'; then
            echo "❌ Hardcoded database credentials detected!"
            exit 1
          fi
          echo "✅ No hardcoded credentials found"
        continue-on-error: true

      - name: Lint Next.js
        run: npm run lint

      - name: Typecheck Next.js
        run: npx tsc --noEmit

      - name: Build Next.js
        run: npm run build
        env:
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Lint immersive
        run: npm run lint --prefix ./immersive

      - name: Typecheck immersive
        run: npx tsc --noEmit --prefix ./immersive

      - name: Build immersive (Vite)
        run: npm run build --prefix ./immersive

      - name: Run Playwright E2E
        run: npx playwright test
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Lighthouse CI
        run: npx lighthouse http://localhost:3000 --output=json --output-path=./lighthouse-report.json --chrome-flags="--headless --no-sandbox --disable-gpu"
        continue-on-error: true

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: ./lighthouse-report.json

  deploy:
    needs: quality-gates
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.quality-gates.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy immersive 3D to Workers Static Assets
        working-directory: ./immersive
        run: wrangler pages deploy dist --project-name=immersive-3d
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy portfolio API Worker
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Trigger Render deploy (fallback)
        run: |
          echo "Render autoDeploy disabled. Render kept as fallback."
          echo "Add RENDER_DEPLOY_HOOK secret to enable automatic deployment after CI passes."
        # curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }}
