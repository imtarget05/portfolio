name: Scheduled Vectorize Embed

on:
  schedule:
    - cron: '0 2 * * 0'  # Mỗi Chủ Nhật 02:00 UTC
  workflow_dispatch:

jobs:
  embed:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install tsx
        run: npm install -g tsx

      - name: Run scheduled project embedding (optional, needs Cloudflare secrets)
        run: npx tsx scripts/embed-projects.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VECTORIZE_INDEX_ID: ${{ secrets.VECTORIZE_INDEX_ID }}
