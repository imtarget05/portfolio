services:
  - type: web
    name: portfolio-of-mainguyenbinhtan
    env: docker
    repo: https://github.com/imtarget05/portfolio
    dockerfilePath: ./Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_AI_MODEL
        value: "@cf/meta/llama-3.1-8b-instruct"
      - key: VECTORIZE_INDEX_ID
        sync: false
      - key: VECTORIZE_API_TOKEN
        sync: false
    healthCheckPath: /
    autoDeploy: false
